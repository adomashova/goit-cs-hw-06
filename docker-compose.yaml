# Запуск: docker compose up --build   (або docker-compose up --build)
# Вебдодаток: http://localhost:3000
services:
  mongo:
    image: mongo:7
    container_name: goit_cs_hw06_mongo
    restart: unless-stopped
    volumes:
      # дані MongoDB зберігаються в томі, а не всередині контейнера -
      # вони переживають `docker compose down` та перестворення контейнера
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: goit_cs_hw06_app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "3000:3000"   # HTTP-сервер

volumes:
  mongo_data:
